# Compila el mod en GitHub. Al subir un tag (v1.0.1, v1.0.2...) publica una Release con el jar.
# Sin probar: si falla, revisa el log en la pestana Actions.
name: Build Atenas Client
on:
  push:
    tags: ['v*']
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Gradle 2.14.1
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-2.14.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "MOD_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "MOD_VERSION=dev" >> $GITHUB_ENV; fi
      - name: Compilar
        run: /tmp/gradle-2.14.1/bin/gradle setupCIWorkspace build -PmodVersion=$MOD_VERSION --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AtenasClient
          path: build/libs/AtenasClient-*[0-9].jar
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/AtenasClient-*[0-9].jar
